      <rect x="946" y="284" width="426" height="78" rx="13" fill="#EBE5F5"/>
      <path d="M987 305l17 6v11c0 13-17 21-17 21s-17-8-17-21v-11zM980 322l5 5 10-12" fill="none" stroke="#6A5088" stroke-width="2"/>
