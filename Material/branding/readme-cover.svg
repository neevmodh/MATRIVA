    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123D36"/><stop offset=".52" stop-color="#17374B"/><stop offset="1" stop-color="#453653"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#4BBFA0" stop-opacity=".25"/><stop offset="1" stop-color="#4BBFA0" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent"><stop stop-color="#7CE0B5"/><stop offset=".5" stop-color="#F6D889"/><stop offset="1" stop-color="#D3B9EF"/></linearGradient>
  </defs>
  <rect width="1480" height="460" rx="24" fill="url(#background)"/>
  <rect width="1480" height="7" rx="3" fill="url(#accent)"/>
  <circle cx="1170" cy="210" r="330" fill="url(#glow)"/>
  <g fill="none" stroke="#FFFFFF" stroke-opacity=".06"><circle cx="1160" cy="220" r="170"/><circle cx="1160" cy="220" r="225"/><circle cx="1160" cy="220" r="285"/><path d="M870 0V460M925 0V460M0 390H1480"/></g>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="76" y="62" fill="#9FE4C5" font-size="13" font-weight="700" letter-spacing="3">MATERNAL EDUCATION / ONE WORKSPACE</text>
    <text x="70" y="174" fill="#FFF9E9" font-family="Georgia,serif" font-size="103" letter-spacing="4">MATRIVA</text>
    <text x="76" y="231" fill="#F6D889" font-size="34" font-weight="700">Ask. Plan. Track.</text>
    <text x="76" y="277" fill="#D8E8E4" font-size="21">Sources you can inspect. Tools for your week.</text>
    <text x="76" y="309" fill="#D8E8E4" font-size="21">Personal data controls in one place.</text>
    <g font-size="13" font-weight="700">
      <rect x="76" y="344" width="178" height="32" rx="16" fill="#244F49" stroke="#77BD9F" stroke-opacity=".5"/><text x="165" y="365" text-anchor="middle" fill="#BCF2D8">OFFLINE BY DEFAULT</text>
      <rect x="268" y="344" width="166" height="32" rx="16" fill="#374A64" stroke="#9BBDD9" stroke-opacity=".5"/><text x="351" y="365" text-anchor="middle" fill="#D0E6FF">SOURCE REFERENCES</text>
      <rect x="448" y="344" width="171" height="32" rx="16" fill="#514255" stroke="#CEAFDB" stroke-opacity=".5"/><text x="533" y="365" text-anchor="middle" fill="#EAD3F5">CONSENT CONTROLS</text>
    </g>
    <g>
      <rect x="946" y="82" width="426" height="78" rx="13" fill="#EAF3E8"/>
      <path d="M972 105h14c9 0 14 5 14 5s5-5 14-5h14v31h-14c-9 0-14 4-14 4s-5-4-14-4h-14zM1000 110v30" fill="none" stroke="#2E6651" stroke-width="2"/>
      <text x="1050" y="114" font-size="19" font-weight="700" fill="#244638">Understand the evidence</text><text x="1050" y="139" font-size="15" fill="#526C60">Citations · labels · source review</text>
      <rect x="1014" y="183" width="358" height="78" rx="13" fill="#F8EDCF"/>
