<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="460" viewBox="0 0 1480 460" role="img" aria-labelledby="title description">
  <title id="title">MATRIVA — ask, plan and track</title>
  <desc id="description">A colorful project cover presenting evidence-based education, care tools and privacy controls. Offline by default. Clinical review remains pending.</desc>
