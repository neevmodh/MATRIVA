<text x="562" y="215" class="tag" style="fill:#F5F3EB">01 / REQUEST</text>
<text x="562" y="245" font-size="23" font-weight="700" style="fill:#F5F3EB">Receive the question</text>
<text x="562" y="272" font-size="17" style="fill:#F5F3EB">POST /chat or /chat/stream</text>
<rect x="540" y="365" width="400" height="150" rx="10" fill="#F7E3E1" stroke="#BD8583" stroke-width="1.5"/>
<text x="562" y="390" class="tag">02 / BEFORE RETRIEVAL</text>
<text x="562" y="420" font-size="23" font-weight="700">Safety + personal guard rails</text>
<text x="562" y="447" font-size="17">Intent, danger signs, risky requests</text>
<text x="562" y="469" font-size="17">Classifier failure: service unavailable</text>
<rect x="70" y="365" width="380" height="150" rx="10" fill="#F7E3E1" stroke="#BD8583" stroke-width="1.5"/>
<text x="92" y="390" class="tag">STOP / HIGH RISK</text>
<text x="92" y="420" font-size="23" font-weight="700">Refuse risky advice</text>
<text x="92" y="447" font-size="17">Fixed, specific explanation</text>
<text x="92" y="469" font-size="17">No retrieval or provider call</text>
<rect x="1030" y="365" width="380" height="150" rx="10" fill="#F7E3E1" stroke="#BD8583" stroke-width="1.5"/>
<text x="1052" y="390" class="tag">STOP / URGENT</text>
<text x="1052" y="420" font-size="23" font-weight="700">Escalate urgent symptoms</text>
<text x="1052" y="447" font-size="17">Emergency message and helplines</text>
<text x="1052" y="469" font-size="17">No retrieval or provider call</text>
<rect x="540" y="590" width="400" height="150" rx="10" fill="#FFFFFF" stroke="#BFC9BB" stroke-width="1.5"/>
<text x="562" y="615" class="tag">03 / CONTEXT</text>
<text x="562" y="645" font-size="23" font-weight="700">Prepare a safe turn</text>
<text x="562" y="672" font-size="17">Resolve follow-ups and language</text>
<text x="562" y="694" font-size="17">Use consented profile context</text>
<rect x="70" y="590" width="380" height="150" rx="10" fill="#E5F0EF" stroke="#739895" stroke-width="1.5"/>
<text x="92" y="615" class="tag">ACTION / WHEN DETECTED</text>
<text x="92" y="645" font-size="23" font-weight="700">Record a safe statement</text>
<text x="92" y="672" font-size="17">Consented meal / reading log</text>
<text x="92" y="694" font-size="17">Return the action summary</text>
<rect x="70" y="835" width="610" height="160" rx="10" fill="#E5EDDF" stroke="#78936B" stroke-width="1.5"/>
<text x="92" y="860" class="tag">04A / RAG_ENGINE=LOCAL</text>
<text x="92" y="890" font-size="23" font-weight="700">Offline hybrid retrieval</text>
<text x="92" y="917" font-size="17">BM25, n-grams, concepts, LSA, graph</text>
<text x="92" y="939" font-size="17">Feedback, fusion, rerank and diversity</text>
<rect x="800" y="835" width="610" height="160" rx="10" fill="#F6ECD2" stroke="#B0985E" stroke-width="1.5"/>
<text x="822" y="860" class="tag">04B / RAG_ENGINE=EXTERNAL</text>
<text x="822" y="890" font-size="23" font-weight="700">External hybrid retrieval</text>
<text x="822" y="917" font-size="17">Keyword / vector retrieval and rerank</text>
<text x="822" y="939" font-size="17">Gemini embeddings; optional Tavily web sources</text>
<polygon points="740.0,1080 940,1140.0 740.0,1200 540,1140.0" fill="#F6ECD2" stroke="#B0985E" stroke-width="1.5"/>
<text x="740.0" y="1135.0" text-anchor="middle" font-size="22" font-weight="700">Evidence sufficient?</text>
<text x="740.0" y="1162.0" text-anchor="middle" font-size="15">Approved evidence / external labels</text>
<rect x="70" y="1070" width="380" height="135" rx="10" fill="#F6ECD2" stroke="#B0985E" stroke-width="1.5"/>
<text x="92" y="1095" class="tag">STOP / NO SUPPORT</text>
<text x="92" y="1125" font-size="23" font-weight="700">Say evidence is insufficient</text>
<text x="92" y="1152" font-size="17">Fixed response; no invented claims</text>
<rect x="70" y="1280" width="610" height="145" rx="10" fill="#E5EDDF" stroke="#78936B" stroke-width="1.5"/>
<text x="92" y="1305" class="tag">05A / OFFLINE COMPOSITION</text>
<text x="92" y="1335" font-size="23" font-weight="700">Extract from the passages</text>
<text x="92" y="1362" font-size="17">Local composer builds a cited answer</text>
<text x="92" y="1384" font-size="17">No external model or API key</text>
<rect x="800" y="1280" width="610" height="145" rx="10" fill="#F6ECD2" stroke="#B0985E" stroke-width="1.5"/>
<text x="822" y="1305" class="tag">05B / EXTERNAL GENERATION</text>
<text x="822" y="1335" font-size="23" font-weight="700">Generate from the context packet</text>
<text x="822" y="1362" font-size="17">LangChain → ChatGroq → citation validation</text>
<text x="822" y="1384" font-size="17">Grounded fallback when a provider fails</text>
<rect x="540" y="1510" width="400" height="150" rx="10" fill="#F7E3E1" stroke="#BD8583" stroke-width="1.5"/>
<text x="562" y="1535" class="tag">06 / FINALIZE</text>
<text x="562" y="1565" font-size="23" font-weight="700">Check output + citations</text>
<text x="562" y="1592" font-size="17">Reject unsafe advice or invalid sources</text>
<text x="562" y="1614" font-size="17">Replace the answer when checks fail</text>
<rect x="540" y="1710" width="400" height="125" rx="10" fill="#E5EDDF" stroke="#78936B" stroke-width="1.5"/>
<text x="562" y="1735" class="tag">07 / DELIVERY</text>
<text x="562" y="1765" font-size="23" font-weight="700">Persist and return</text>
<text x="562" y="1792" font-size="17">Answer, sources, notices, suggestions</text>
<text x="562" y="1814" font-size="17">JSON response or validated final SSE</text>
<line x1="60" x2="1420" y1="1886" y2="1886" stroke="#CCD4C6"/>
<text x="60" y="1916" font-size="16" class="caption">Fixed safety replies also persist. A validated final SSE event can replace earlier deltas; the client must apply the correction.</text>
<text x="60" y="1946" font-size="13" class="caption">Code reference: services/chat.py · rag/pipeline.py · rag/local/engine.py · safety/guardrails/output.py</text>
