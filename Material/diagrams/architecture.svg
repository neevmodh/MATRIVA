<text x="1012" y="505" class="tag">YAML / JSON RULES</text>
<text x="1012" y="535" font-size="23" font-weight="700">Deterministic care services</text>
<text x="1012" y="562" font-size="17">Dating, plans, readings, meals</text>
<text x="1012" y="584" font-size="17">Check-ins, screening, summary</text>
