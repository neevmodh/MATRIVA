<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1120" role="img" aria-labelledby="title desc">
<title id="title">A modular monolith, with clear boundaries</title><desc id="desc">One browser workspace. One API. Safety and care decisions stay on the server.. Solid arrows: application data flow. Dashed arrows: optional external adapters. Development uses SQLite; production uses PostgreSQL.</desc>
