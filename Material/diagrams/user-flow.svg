<text x="82" y="255" class="tag">01 / LANDING</text>
<text x="82" y="285" font-size="23" font-weight="700">Discover MATRIVA</text>
<text x="82" y="312" font-size="17">Read the scope and limits</text>
<text x="82" y="334" font-size="17">Open signup or login</text>
<rect x="410" y="230" width="300" height="155" rx="10" fill="#FFFFFF" stroke="#BFC9BB" stroke-width="1.5"/>
<text x="432" y="255" class="tag">02 / AUTHENTICATION</text>
<text x="432" y="285" font-size="23" font-weight="700">Create an account</text>
<text x="432" y="312" font-size="17">Name, email, password</text>
<text x="432" y="334" font-size="17">Or sign into an existing</text>
<text x="432" y="356" font-size="17">account</text>
<rect x="760" y="230" width="300" height="155" rx="10" fill="#FFFFFF" stroke="#BFC9BB" stroke-width="1.5"/>
<text x="782" y="255" class="tag">03 / ONBOARDING</text>
<text x="782" y="285" font-size="23" font-weight="700">Set up with consent</text>
<text x="782" y="312" font-size="17">Week / last period / due date</text>
<text x="782" y="334" font-size="17">Region, diet and storage</text>
<text x="782" y="356" font-size="17">consent</text>
<rect x="1110" y="230" width="310" height="155" rx="10" fill="#263A2A" stroke="#263A2A" stroke-width="1.5"/>
<text x="1132" y="255" class="tag" style="fill:#F5F3EB">04 / CHAT</text>
<text x="1132" y="285" font-size="23" font-weight="700" style="fill:#F5F3EB">Enter the workspace</text>
<text x="1132" y="312" font-size="17" style="fill:#F5F3EB">Chat + sidebar shortcuts</text>
<text x="1132" y="334" font-size="17" style="fill:#F5F3EB">One place for care tools</text>
<rect x="760" y="485" width="300" height="155" rx="10" fill="#F6ECD2" stroke="#B0985E" stroke-width="1.5"/>
<text x="782" y="510" class="tag">CONSENT NOT GRANTED</text>
<text x="782" y="540" font-size="23" font-weight="700">Pause setup</text>
<text x="782" y="567" font-size="17">No consented health profile</text>
<text x="782" y="589" font-size="17">saved</text>
<text x="782" y="611" font-size="17">Return when ready to continue</text>
<rect x="60" y="745" width="400" height="190" rx="10" fill="#E5EDDF" stroke="#78936B" stroke-width="1.5"/>
<text x="82" y="770" class="tag">JOURNEY A / GUIDANCE</text>
<text x="82" y="800" font-size="23" font-weight="700">Ask and learn</text>
<text x="82" y="827" font-size="17">Question → safety → evidence</text>
<text x="82" y="849" font-size="17">Sources, refusal or escalation</text>
<text x="82" y="871" font-size="17">Book, library and knowledge map</text>
<rect x="540" y="745" width="400" height="190" rx="10" fill="#E5F0EF" stroke="#739895" stroke-width="1.5"/>
<text x="562" y="770" class="tag">JOURNEY B / CARE</text>
<text x="562" y="800" font-size="23" font-weight="700">Plan and track</text>
<text x="562" y="827" font-size="17">Plan, check-in, screening</text>
<text x="562" y="849" font-size="17">Readings, meals, food guide</text>
<text x="562" y="871" font-size="17">Printable doctor summary</text>
<rect x="1020" y="745" width="400" height="190" rx="10" fill="#FFFFFF" stroke="#BFC9BB" stroke-width="1.5"/>
<text x="1042" y="770" class="tag">JOURNEY C / CONTROL</text>
<text x="1042" y="800" font-size="23" font-weight="700">Manage your data</text>
<text x="1042" y="827" font-size="17">Settings and safety profile</text>
<text x="1042" y="849" font-size="17">Download the JSON export</text>
<text x="1042" y="871" font-size="17">Withdraw consent / delete account</text>
