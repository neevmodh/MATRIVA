<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1010" viewBox="0 0 1480 1010" role="img" aria-labelledby="title desc">
<title id="title">Evidence earns its place in the answer</title><desc id="desc">Uploading or indexing a document never counts as clinical approval.. Only active documents with approved documents and sources enter ordinary retrieval. An admin action is not clinical certification.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6C8066"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#263A2A}.serif{font-family:Georgia,serif}.caption{fill:#5D7059}.tag{font-size:11px;font-weight:700;letter-spacing:1.6px}</style>
<rect width="1480" height="1010" fill="#F5F3EB"/>
<rect x="0" y="0" width="1480" height="8" fill="#506C48"/>
<text x="60" y="48" class="tag">MATRIVA / TECHNICAL ATLAS</text>
<text x="60" y="108" class="serif" font-size="43">Evidence earns its place in the answer</text>
<text x="60" y="143" font-size="18" class="caption">Uploading or indexing a document never counts as clinical approval.</text>
