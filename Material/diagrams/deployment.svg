<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1160" role="img" aria-labelledby="title desc">
<title id="title">The production stack and its boundaries</title><desc id="desc">Docker Compose currently defines four services. Public ingress remains an operator responsibility.. The production Compose file exposes internal ports only. A reverse proxy / published ports and HTTPS must be configured for public access.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6C8066"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#263A2A}.serif{font-family:Georgia,serif}.caption{fill:#5D7059}.tag{font-size:11px;font-weight:700;letter-spacing:1.6px}</style>
<rect width="1480" height="1160" fill="#F5F3EB"/>
<rect x="0" y="0" width="1480" height="8" fill="#506C48"/>
<text x="60" y="48" class="tag">MATRIVA / TECHNICAL ATLAS</text>
<text x="60" y="108" class="serif" font-size="43">The production stack and its boundaries</text>
<text x="60" y="143" font-size="18" class="caption">Docker Compose currently defines four services. Public ingress remains an operator responsibility.</text>
<rect x="50" y="425" width="1370" height="570" rx="12" fill="none" stroke="#D6DDD0" stroke-width="1.5"/>
<text x="70" y="454" class="tag caption">DOCKER COMPOSE / PRIVATE SERVICE NETWORK</text>
