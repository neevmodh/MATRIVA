name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, backend/bhavya, frontend/raj, mvp, "fix/**"]

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python ../scripts/check_docs.py
      # requirements-dev.txt pins ruff and mypy, so CI and a laptop report the same findings.
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - run: pip-audit
      # Each step runs even if an earlier one failed, so one problem cannot hide the others.
      - run: ruff check .
        if: always()
      - run: python scripts/secret_scan.py --root ..
        if: always()
      - run: mypy app/
        if: always()
      - run: pytest
        if: always()

  ingestion:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install -r ../backend/requirements.txt
      - run: pytest tests/

  evaluation:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: evaluation
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install -r ../backend/requirements.txt
      - run: pytest tests/

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  production-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python scripts/docker_smoke.py --browser
